[build]
  command = "npm run build"
  publish = "public"

# Um único backend: mantém as contas existentes no Render.
[[redirects]]
  from = "/api/*"
  to = "https://testefeira.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
